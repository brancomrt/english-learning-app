name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Get version name
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: List APK outputs
        run: |
          echo "=== Debug APK ==="
          ls -la app/build/outputs/apk/debug/
          echo "=== Release APK ==="
          ls -la app/build/outputs/apk/release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## English Learning App ${{ steps.version.outputs.VERSION }}
            
            ### Downloads
            - **Debug APK**: Para testes (não precisa de assinatura)
            - **Release APK**: Versão de produção (unsigned)
            
            ### Instalação
            1. Baixe o APK debug
            2. Habilite "Instalar apps de fontes desconhecidas" no Android
            3. Instale o APK
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
